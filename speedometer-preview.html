<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Спидометр · Сельская почта</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202724;color:#e7e6d9;font:15px system-ui}canvas{display:block}header{position:absolute;top:30px;left:36px;pointer-events:none}h1{font-size:28px;font-weight:500;margin:8px 0}small{color:#b4bcae;letter-spacing:.12em}p{color:#b4bcae;font-size:13px}.controls{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:#141b18eb;border:1px solid #526052;border-radius:12px;padding:20px 24px;width:min(520px,94vw)}.row{display:flex;align-items:center;gap:14px;margin:10px 0}input[type=range]{flex:1;accent-color:#c7bc84}button{background:#344238;color:#e7e6d9;border:1px solid #617161;padding:8px 14px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#706641}output{min-width:76px;font-variant-numeric:tabular-nums}#status{position:absolute;right:26px;top:26px;font-size:12px;color:#b4bcae;max-width:240px}a{color:inherit}@media(max-width:600px){header{left:20px;top:16px}h1{font-size:21px}#status{top:110px;left:20px}}
</style></head>
<body><header><small>СЕЛЬСКАЯ ПОЧТА / ДЕТАЛЬ 01</small><h1>Механический спидометр</h1><p>Вращение — мышью · Приближение — колесом</p></header><div id="status">Загрузка модели…</div>
<section class="controls" aria-label="Проверка прибора"><div class="row"><button id="game" aria-pressed="true">Игровой</button><button id="cinematic" aria-pressed="false">Для роликов</button><button id="distance" aria-pressed="false">Размер в кабине</button></div><div class="row"><label for="speed">Скорость</label><input id="speed" type="range" min="0" max="120" value="42"><output id="value">42 км/ч</output></div><div class="row"><button id="sweep" aria-pressed="false">Проверить стрелку</button><button id="front">Вид спереди</button><button id="retro" aria-pressed="false">Ретро</button></div></section>
<script type="module" src="/src/previews/SpeedometerPreview.ts"></script></body></html>
